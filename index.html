<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Explora el catálogo, las ofertas y los productos destacados de nuestra tienda online.">
    <title>Ejercicio 7 - Tienda Online</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
    <link rel="stylesheet" href="css/api-store.css">
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
      defer></script>
    <script src="js/api-store.js" defer></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="#">🛍️ Tienda Online</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menuTienda"
          aria-controls="menuTienda"
          aria-expanded="false"
          aria-label="Abrir menú de navegación">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuTienda">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="#destacados">Destacados</a></li>
            <li class="nav-item"><a class="nav-link" href="#ofertas">Ofertas</a></li>
            <li class="nav-item"><a class="nav-link" href="#catalogo">Catálogo</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4 py-lg-5">
      <section id="destacados" class="mb-5" aria-labelledby="destacados-titulo">
        <h1 id="destacados-titulo" class="section-title">Productos destacados</h1>
        <div
          id="carrusel"
          class="carousel slide featured-carousel"
          aria-label="Productos destacados"
          aria-live="polite">
          <div class="carousel-inner" id="carrusel-contenido">
            <div class="carousel-item active">
              <div class="loading-state">Cargando productos destacados…</div>
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carrusel" data-bs-slide="prev" aria-label="Producto anterior">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carrusel" data-bs-slide="next" aria-label="Producto siguiente">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
          </button>
        </div>
      </section>

      <section id="ofertas" class="mb-5" aria-labelledby="ofertas-titulo">
        <h2 id="ofertas-titulo" class="section-title">🔥 Ofertas especiales 🔥</h2>
        <div class="row g-4" id="ofertas-contenido" aria-live="polite">
          <div class="col-12"><p class="loading-state">Cargando ofertas…</p></div>
        </div>
      </section>

      <section id="catalogo" aria-labelledby="catalogo-titulo">
        <h2 id="catalogo-titulo" class="section-title">Todos los productos</h2>
        <div class="row g-4" id="catalogo-contenido" aria-live="polite">
          <div class="col-12"><p class="loading-state">Cargando catálogo…</p></div>
        </div>
      </section>
    </main>

    <footer class="py-4 mt-5 border-top">
      <div class="container text-center text-secondary small">
        Catálogo de práctica conectado a Fake Store API
      </div>
    </footer>

    <div
      class="modal fade"
      id="modalDetalles"
      tabindex="-1"
      aria-labelledby="modalDetallesTitulo"
      aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="modalDetallesTitulo">Detalles del producto</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body" id="modalDetallesContenido"></div>
        </div>
      </div>
    </div>
  </body>
</html>
